[package]
name = "agntcy-slim-mcp-proxy"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
description = "Proxy for exposing a native MCP server over SLIM"

[package.metadata.cargo-machete.renamed]
agntcy-slim = "slim"
agntcy-slim-auth = "slim_auth"
agntcy-slim-config = "slim_config"
agntcy-slim-datapath = "slim_datapath"
agntcy-slim-service = "slim_service"
agntcy-slim-session = "slim_session"
agntcy-slim-signal = "slim_signal"

[[bin]]
name = "slim-mcp-proxy"
path = "src/main.rs"

[dependencies]
agntcy-slim = "3.4.6"
# from the slim repo
# agntcy-slim = { git = "https://github.com/agntcy/slim.git", branch = "main" }
agntcy-slim-auth = "0.17.10"
agntcy-slim-config = "0.17.10"
agntcy-slim-datapath = "0.19.15"
agntcy-slim-service = "0.13.15"
agntcy-slim-session = "0.7.27"
agntcy-slim-signal = "0.1.40"
async-trait = "0.1.88"
clap = "4.5.37"
rand = "0.9.1"
rmcp = { version = "3.8.0", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"

[dev-dependencies]
agntcy-slim-mcp-transport = { path = "../slim-mcp-transport" }
axum = "0.8"
rmcp = { version = "3.8.0", features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }

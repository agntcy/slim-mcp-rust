---
name: Trigger integrations
description: Run the MCP integration tests in the CSIT repository
inputs:
  github-token:
    description: 'Token allowed to dispatch workflows in agntcy/csit'
    required: true
  mcp-proxy-image-tag:
    description: 'mcp-proxy image tag to test'
    required: true

runs:
  using: 'composite'
  steps:
    # CSIT deploys its own default SLIM chart and image unless they are
    # passed, so pass the ones this commit's mcp-proxy chart deploys.
    - name: Resolve SLIM versions
      id: slim
      shell: bash
      run: |
        set -euo pipefail
        chart_tag=$(yq '.dependencies[] | select(.name == "slim") | .version' charts/mcp-proxy/Chart.yaml)
        image_tag=$(helm show chart oci://ghcr.io/agntcy/slim/helm/slim --version "${chart_tag}" | yq '.appVersion')
        for v in "${chart_tag}" "${image_tag}"; do
          if [[ -z "${v}" || "${v}" == "null" ]]; then
            echo "::error::Could not resolve the SLIM chart and image versions"
            exit 1
          fi
        done
        echo "chart-tag=${chart_tag}" >> "$GITHUB_OUTPUT"
        echo "image-tag=${image_tag}" >> "$GITHUB_OUTPUT"

    - name: Trigger the CSIT MCP tests
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        MCP_PROXY_IMAGE_TAG: ${{ inputs.mcp-proxy-image-tag }}
        SLIM_CHART_TAG: ${{ steps.slim.outputs.chart-tag }}
        SLIM_IMAGE_TAG: ${{ steps.slim.outputs.image-tag }}
        SLIM_MCP_RUST_REF: ${{ github.ref_name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const inputs = {
            override_mcp_proxy_image_tag: process.env.MCP_PROXY_IMAGE_TAG,
            override_slim_chart_tag: process.env.SLIM_CHART_TAG,
            override_slim_image_tag: process.env.SLIM_IMAGE_TAG,
            override_slim_mcp_rust_ref: process.env.SLIM_MCP_RUST_REF,
          };
          console.log('Dispatching agntcy/csit test-slim-mcp.yaml with', inputs);
          await github.rest.actions.createWorkflowDispatch({
            owner: 'agntcy',
            repo: 'csit',
            workflow_id: 'test-slim-mcp.yaml',
            ref: 'main',
            inputs,
          });

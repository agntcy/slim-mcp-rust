---
name: ci-release-rust

on:
  push:
    branches:
      - main

jobs:
  # Release unpublished packages.
  release-crates:
    name: Release slim crates
    runs-on: ubuntu-latest
    # Publishes with crates.io Trusted Publishing: crates.io trusts this
    # workflow in the release environment, so no registry token is needed.
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Authenticate as the GitHub App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: .
          # Keep release-plz off the lint job's cache key; both save from main.
          cache-key-suffix: "-release-plz"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: ./Cargo.toml
          config: ./.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-crates-pr:
    name: Release slim crates - PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Authenticate as the GitHub App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: .
          # Keep release-plz off the lint job's cache key; both save from main.
          cache-key-suffix: "-release-plz"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: ./Cargo.toml
          config: ./.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
